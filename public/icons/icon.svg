<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="tealGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0d9488"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#042f2e" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Background Rounded Rect -->
  <rect width="512" height="512" rx="112" fill="url(#tealGrad)"/>

  <!-- Outer Ring Accent -->
  <rect x="24" y="24" width="464" height="464" rx="88" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="4"/>

  <!-- Shield Shape -->
  <path d="M256 96 L384 144 V264 C384 352 328 416 256 448 C184 416 128 352 128 264 V144 Z" fill="#ffffff" filter="url(#shadow)"/>

  <!-- Inner Teal Shield / Check / Logistics Symbol -->
  <path d="M256 128 L360 168 V264 C360 336 312 392 256 420 C200 392 152 336 152 264 V168 Z" fill="#f0fdfa"/>

  <!-- Checkmark & Box icon in center -->
  <path d="M216 256 L244 284 L304 220" fill="none" stroke="#0f766e" stroke-width="24" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="200" y="324" width="112" height="24" rx="12" fill="#0f766e" fill-opacity="0.2"/>
</svg>
